<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>improve Cricket Game </title>
<link rel="stylesheet" href="cricket.css">
  
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=refresh" />
</head>
<body>
  <h1>Bat Ball Stump Game</h1>

   
  <button class="choice" onclick="
   let computerChoice = generateComputerchoice();

    let resultMsg = getResult('Bat', computerChoice);

     showResult('Bat', computerChoice, resultMsg);"> <img src="images/bat.png" alt="Bat image"  class="choice-images"></button>


  <button class="choice" onclick="
    computerChoice = generateComputerchoice();
  
  resultMsg= getResult('Ball', computerChoice);
   
  showResult('Ball', computerChoice, resultMsg);"> <img src="images/ball.png" alt="Ball image"  class="choice-images"></button>


  <button class="choice" onclick="
   computerChoice = generateComputerchoice();
  
  resultMsg= getResult('Stump', computerChoice);
   
   showResult('Stump', computerChoice, resultMsg);"><img src="images/stump.png" alt="Stump image"  class="choice-images"></button>

   

   <h3 id="user_move"></h3>
   <h3 id="computer_move"></h3>
   <h3 id="result"></h3>
   <h3 id="score"></h3>


     <button class="refresh_button" onclick="localStorage.clear()
   resetScore();"><span class="material-symbols-outlined">
refresh
</span></button>

<script>
  let scoreStr = localStorage.getItem('Score');
  let score;
  resetScore(scoreStr);

  function resetScore(scoreStr) {
     score = scoreStr ? JSON.parse(scoreStr) : {
      win : 0,
    lost : 0,
    tie : 0,

    };
    
score.displayScore =  function() {
      return ` Score:  won: ${score.win}, Lost : ${score.lost}, Tie : ${score.tie}`;
};

showResult();
  }

  function generateComputerchoice(){
    // This will genarate random number between 0and 3
    let randomNumber = Math.random() * 3; 
    
  if( randomNumber<=1){
    return 'Bat';
    
  } else if (randomNumber<=2){
    return'Ball';
    
  } else {
    return 'Stump';
  }
  return computerChoice;
  }

  function getResult(userMove, computerMove){
  if(userMove === 'Bat'){
      if (  computerMove === 'Ball'){
        score.win = score.win +1;
     return 'user won';
     } else if(computerMove === 'Bat'){
      score.tie = score.tie + 1;
     return `It's a tie`;
     } else {
      score.lost = score.lost + 1;
     return 'computer won';
     }
  }
  else if (userMove === 'Ball'){
      if (  computerMove === 'Ball'){
        score.tie++;
      return `It's a tie`;
      } else if(computerMove === 'Bat'){
        score.lost++;
       return `computer has won`;
      } else {
        score.win++;
      return 'user won';
      }

  }
  else {
      if (computerMove === 'Ball'){
        score.lost++;
     return 'computer has won';
     } else if(computerMove === 'Bat'){
      score.win++;
     return `user won`;
     } else {
      score.tie++;
     return `It's a tie`;
     }

  }
  }

  function showResult(userMove, computerMove, Result){
   
   localStorage.setItem('Score', JSON.stringify(score));


   document.querySelector('#user_move').innerText = userMove ?`You have chosen ${userMove}` : '';

   document.querySelector('#computer_move').innerText = computerMove ?`computer choice is ${computerMove}` : '';

   document.querySelector('#result').innerText = Result ? Result : '';

   document.querySelector('#score').innerText =  score.displayScore();

    
    
  }
  
</script>
</body>
</html>
    
</body>
</html>
